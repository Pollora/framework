version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "automerge"
    versioning-strategy: "increase"
    ignore:
      # PHPStan 2.3.6 removed AnalyserResult::getCollectedData(), which pest-plugin-type-coverage 3.x
      # still calls: `pest --type-coverage` fails with "Call to undefined method" (#667), so composer.json
      # caps phpstan/phpstan below 2.3.6. The fix is only in the plugin 4.0.6+ (Pest 4) and 5.x; lift this
      # ignore, and the cap, when the framework moves to Pest 4 or later.
      - dependency-name: "phpstan/phpstan"
        versions: [">=2.3.6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "automerge"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "automerge"

  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "develop"
    ignore:
      # The CI and the E2E suite run on Node 22: the Node types follow it
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "automerge"
